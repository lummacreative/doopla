<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tasá tu propiedad gratis — Doopla</title>
  <link rel="icon" href="https://www.doopla.com.ar/images/favicon/favicon-96x96.png">
  <script>
    // Reemplazo de google.script.run para cuando el formulario NO está adentro
    // de Google: misma forma de llamar, pero por fetch al servidor. Sin
    // cookies (credentials:'omit'), así no importan las cuentas de Google.
    (function () {
      var URL_SERVIDOR = "https://script.google.com/macros/s/AKfycbz7aZLZzmZER-N_8M_KKtPKs-t-0jDQVsEVoMcY06BuEl2spsUH3Tgz7ylhLd53iTtd/exec";
      function llamada() {
        var ok = function () {}, mal = function () {};
        var p = new Proxy({}, { get: function (_, nombre) {
          if (nombre === 'withSuccessHandler') return function (f) { ok = f; return p; };
          if (nombre === 'withFailureHandler') return function (f) { mal = f; return p; };
          return function () {
            var args = Array.prototype.slice.call(arguments);
            fetch(URL_SERVIDOR, { method: 'POST', credentials: 'omit', redirect: 'follow',
              headers: { 'Content-Type': 'text/plain;charset=utf-8' },
              body: JSON.stringify({ tipo: 'formulario_publico', fn: nombre, args: args }) })
              .then(function (r) { return r.json(); })
              .then(function (r) { if (r && r.ok) ok(r.valor); else mal(new Error((r && r.error) || 'No pudimos guardar. Probá de nuevo.')); })
              .catch(function () { mal(new Error('Sin conexión. Probá de nuevo en un momento.')); });
          };
        } });
        return p;
      }
      window.google = { script: {} };
      Object.defineProperty(window.google.script, 'run', { get: llamada });
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* Pretasación — la completa el PROPIETARIO, no un agente (16/10/2026).
       Es la única pantalla pública del sistema: nadie se loguea, nadie tiene
       clave. Por eso el tono es de promesa ("tasá gratis"), no de trámite.
       Misma paleta y tipografías que el hub y el buscador a propósito. */
    :root{
      --bg:#ffffff; --surface:#faf8f6; --surface-2:#f2ede9;
      --line:#e8e1db; --ink:#201d1b; --ink-dim:#6b625c;
      --marca:#e36a3e; --marca-ink:#a94a26; --marca-soft:#fbe6dc;
      --salvia:#7d9e83; --salvia-soft:#e7eee8; --salvia-ink:#45604b;
      --bad:#b44b3d;
      color-scheme:light;
    }
    @media (prefers-color-scheme:dark){
      :root:not([data-theme="light"]){
        --bg:#1c1917; --surface:#262220; --surface-2:#2f2a27;
        --line:#3d3631; --ink:#f5f1ed; --ink-dim:#b3a89f;
        --marca:#ea8a5c; --marca-ink:#ffc3a3; --marca-soft:#432920;
        --salvia:#9bb8a0; --salvia-soft:#2a3630; --salvia-ink:#c9dccc;
        --bad:#d97a6a;
        color-scheme:dark;
      }
    }
    :root[data-theme="dark"]{
      --bg:#1c1917; --surface:#262220; --surface-2:#2f2a27;
      --line:#3d3631; --ink:#f5f1ed; --ink-dim:#b3a89f;
      --marca:#ea8a5c; --marca-ink:#ffc3a3; --marca-soft:#432920;
      --salvia:#9bb8a0; --salvia-soft:#2a3630; --salvia-ink:#c9dccc;
      --bad:#d97a6a;
      color-scheme:dark;
    }

    *{box-sizing:border-box;}
    body{
      font-family:'Karla',-apple-system,'Segoe UI',sans-serif;
      background:var(--bg); color:var(--ink);
      margin:0; padding:28px 16px 56px; -webkit-font-smoothing:antialiased;
    }
    .wrap{max-width:680px; margin:0 auto;}
    h1,h2{font-family:'Familjen Grotesk',sans-serif; font-weight:700; letter-spacing:-0.02em; text-wrap:balance; margin:0;}
    .marca{font-family:'Familjen Grotesk',sans-serif; font-weight:700; font-size:15px; color:var(--marca); margin-bottom:6px;}
    h1{font-size:clamp(25px,6vw,33px); margin-bottom:9px;}
    .bajada{color:var(--ink-dim); font-size:15px; line-height:1.55; margin:0 0 26px;}

    /* Dónde va: tres pasos, el que corre marcado. */
    .pasos{display:flex; gap:7px; margin-bottom:24px;}
    .pasos div{flex:1; height:4px; border-radius:4px; background:var(--surface-2);}
    .pasos div.hecho{background:var(--salvia);}
    .pasos div.activo{background:var(--marca);}

    fieldset{border:none; margin:0; padding:0;}
    h2{font-size:18px; margin-bottom:5px;}
    .sub{color:var(--ink-dim); font-size:13.5px; line-height:1.5; margin:0 0 20px;}

    label{display:block; margin-bottom:15px;}
    label .t{display:block; font-size:13px; font-weight:700; margin-bottom:5px;}
    label .t span{font-weight:400; color:var(--ink-dim);}
    input, select, textarea{
      width:100%; font-family:'Karla',sans-serif; font-size:15px; color:var(--ink);
      background:var(--bg); border:1.5px solid var(--line); border-radius:10px;
      padding:11px 13px;
    }
    input:focus, select:focus, textarea:focus{outline:none; border-color:var(--marca);}
    textarea{min-height:78px; resize:vertical;}
    .dupla{display:grid; grid-template-columns:1fr 1fr; gap:0 12px;}
    .terna{display:grid; grid-template-columns:1fr 1fr 1fr; gap:0 12px;}
    @media (max-width:430px){ .terna{grid-template-columns:1fr 1fr;} }

    /* Elegir tocando, no desplegando: más rápido en celular y se ve de un
       vistazo qué opciones hay (pedido de Ely, 16/10/2026). */
    .grupo{margin-bottom:17px;}
    .grupo > .t{display:flex; align-items:center; gap:7px; font-size:13px; font-weight:700; margin-bottom:8px;}
    .grupo > .t svg{width:16px; height:16px; color:var(--marca-ink); flex:none;}
    .grupo > .t span{font-weight:400; color:var(--ink-dim);}
    .opciones{display:flex; flex-wrap:wrap; gap:7px; align-items:stretch;}
    .opcion{
      /* flex:1 con base fija = todas del mismo ancho en cada fila, y el texto
         centrado arriba y abajo aunque entre en dos renglones. */
      flex:1 1 118px; max-width:240px; min-height:48px;
      border:1.5px solid var(--line); background:var(--bg); border-radius:10px;
      padding:8px 12px; font-size:14px; font-weight:600; color:var(--ink-dim);
      cursor:pointer; font-family:'Karla',sans-serif; line-height:1.25;
      display:flex; align-items:center; justify-content:center; text-align:center;
    }
    .opcion:hover{border-color:var(--marca); color:var(--ink);}
    .opcion.elegida{background:var(--marca-soft); border-color:var(--marca); color:var(--marca-ink);}
    .opciones.numeros .opcion{flex:0 1 62px; max-width:84px; padding:8px 4px;}

    /* Resultado de validar la dirección contra el mapa. */
    .chequeo{font-size:13px; line-height:1.5; margin-top:-9px; margin-bottom:15px;}
    .chequeo.ok{color:var(--salvia-ink);}
    .chequeo.duda{color:var(--bad);}
    .chequeo a{color:var(--marca-ink); font-weight:700;}

    .botones{display:flex; gap:10px; margin-top:26px;}
    button{
      cursor:pointer; font-family:'Karla',sans-serif; font-weight:700; font-size:15px;
      padding:13px 22px; border-radius:10px; border:1.5px solid var(--marca);
      background:var(--marca); color:#fff; flex:1;
    }
    button.secundario{background:transparent; color:var(--ink-dim); border-color:var(--line); flex:0 0 auto;}
    button:disabled{opacity:.55; cursor:default;}

    .error{color:var(--bad); font-size:13px; margin-top:12px;}

    /* Fotos */
    .soltar{
      border:1.5px dashed var(--line); border-radius:12px; padding:26px 18px;
      text-align:center; color:var(--ink-dim); font-size:14px; cursor:pointer;
      background:var(--surface);
    }
    .soltar:hover{border-color:var(--marca); color:var(--marca-ink);}
    .soltar b{display:block; font-size:15px; color:var(--ink); margin-bottom:3px;}
    .miniaturas{display:grid; grid-template-columns:repeat(auto-fill,minmax(88px,1fr)); gap:8px; margin-top:14px;}
    .mini{position:relative; aspect-ratio:1; border-radius:9px; overflow:hidden; background:var(--surface-2);}
    .mini img{width:100%; height:100%; object-fit:cover; display:block;}
    .mini .estado{
      position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
      background:rgba(32,29,27,.55); color:#fff; font-size:11px; font-weight:700;
    }
    .mini.lista .estado{background:transparent; color:transparent;}

    .listo{text-align:center; padding:28px 0;}
    .listo .tilde{
      width:58px; height:58px; border-radius:50%; margin:0 auto 18px;
      background:var(--salvia-soft); color:var(--salvia-ink);
      display:flex; align-items:center; justify-content:center;
    }
    .listo .tilde svg{width:28px; height:28px;}

    footer{
      margin-top:34px; padding-top:18px; border-top:1px solid var(--line);
      font-size:11.5px; color:var(--ink-dim); text-align:center;
    }
    footer strong{color:var(--ink);}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="marca">doopla</div>
    <h1>Tasá tu propiedad, gratis</h1>
    <p class="bajada">Contanos qué tenés y te decimos cuánto vale hoy en el mercado, con propiedades comparables de tu zona. Sin compromiso.</p>

    <div class="pasos"><div id="p1"></div><div id="p2"></div><div id="p3"></div></div>
    <div id="cuerpo"></div>

    <footer>Desarrollado por <strong>Lumma Creative</strong></footer>
  </div>

  <script>
    // La fila se crea apenas termina el paso 1. Desde ahí, cada paso la
    // actualiza. Si abandona, queda el contacto igual — que es justamente
    // lo que Google Forms no puede hacer.
    let idPretasacion = null;
    let pasoActual = 1;
    const datos = {};

    // También las comillas: el texto entra en atributos (value="…", href="…") y con
    // solo < > & un nombre con comillas podía cerrar el atributo (10/11/2026).
    function esc(t){ return String(t==null?'':t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

    function pintarPasos() {
      [1,2,3].forEach(n => {
        const el = document.getElementById('p' + n);
        el.className = n < pasoActual ? 'hecho' : (n === pasoActual ? 'activo' : '');
      });
    }

    const campo = (id, titulo, extra, tipo) =>
      '<label><span class="t">' + titulo + (extra ? ' <span>' + extra + '</span>' : '') + '</span>' +
      '<input id="' + id + '" type="' + (tipo || 'text') + '" value="' + esc(datos[id] || '') + '"></label>';

    const IC_CASA = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 4l9 6.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M9 21v-6h6v6"/></svg>';
    const IC_EDIFICIO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="1"/><path d="M8 7h2M14 7h2M8 11h2M14 11h2M8 15h2M14 15h2"/></svg>';
    const IC_AMBIENTES = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="1"/><path d="M3 11h18M11 3v18"/></svg>';
    const IC_CAMA = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18v-8h18v8M3 18v2M21 18v2M3 10V7"/><path d="M7 10V8h5v2"/></svg>';
    const IC_BANO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h16v3a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4z"/><path d="M7 12V6a2 2 0 0 1 4 0"/><path d="M6 21l1-2M18 21l-1-2"/></svg>';
    const IC_AUTO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13l2-5a2 2 0 0 1 2-1h10a2 2 0 0 1 2 1l2 5v5h-3M3 18v-5m0 5h3m12 0H6"/><circle cx="7.5" cy="17.5" r="1.5"/><circle cx="16.5" cy="17.5" r="1.5"/></svg>';
    const IC_ASCENSOR = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="1"/><path d="m9 10 1.5-2L12 10M12 14l1.5 2 1.5-2"/></svg>';
    const IC_LOCAL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h16l-1 11H5z"/><path d="M4 9 6 4h12l2 5"/><path d="M9 20v-5h6v5"/></svg>';

    // Los 48 barrios de CABA. Es una lista cerrada a propósito: escrito a
    // mano, "Villa Crespo" entra como "v.crespo", "Vcrespo" y "villacrepo",
    // y después no se puede agrupar nada por zona.
    const BARRIOS = ['Agronomía','Almagro','Balvanera','Barracas','Belgrano','Boedo','Caballito',
      'Chacarita','Coghlan','Colegiales','Constitución','Flores','Floresta','La Boca','La Paternal',
      'Liniers','Mataderos','Monte Castro','Montserrat','Nueva Pompeya','Núñez','Palermo',
      'Parque Avellaneda','Parque Chacabuco','Parque Chas','Parque Patricios','Puerto Madero',
      'Recoleta','Retiro','Saavedra','San Cristóbal','San Nicolás','San Telmo','Vélez Sarsfield',
      'Versalles','Villa Crespo','Villa del Parque','Villa Devoto','Villa General Mitre',
      'Villa Lugano','Villa Luro','Villa Ortúzar','Villa Pueyrredón','Villa Real','Villa Riachuelo',
      'Villa Santa Rita','Villa Soldati','Villa Urquiza'];

    // Un grupo de opciones que se eligen tocando. `opciones` puede ser
    // texto suelto o {v, icono}.
    function grupo(id, titulo, icono, opciones, clase) {
      const botones = opciones.map(o => {
        const valor = o.v === undefined ? o : o.v;
        const dentro = (o.icono || '') + esc(valor);
        return '<button type="button" class="opcion' + (datos[id] === valor ? ' elegida' : '') +
          '" data-grupo="' + id + '" data-valor="' + esc(valor) + '">' + dentro + '</button>';
      }).join('');
      return '<div class="grupo"><div class="t">' + icono + titulo + '</div>' +
        '<div class="opciones ' + (clase || '') + '">' + botones + '</div></div>';
    }

    // Un solo manejador para todos los grupos de la pantalla.
    function engancharGrupos() {
      document.querySelectorAll('.opcion').forEach(btn => {
        btn.onclick = () => {
          const id = btn.dataset.grupo;
          datos[id] = btn.dataset.valor;
          btn.parentNode.querySelectorAll('.opcion').forEach(o => o.classList.remove('elegida'));
          btn.classList.add('elegida');
        };
      });
    }

    // ── validaciones ──────────────────────────────────────────────────────
    // El teléfono se guarda como lo escribió, pero se cuenta en dígitos: un
    // celular argentino tiene 10 (sin el 0 y sin el 15), y con prefijo de
    // país llega a 13.
    function telefonoValido(t) {
      const digitos = String(t).replace(/\D/g, '');
      return digitos.length >= 8 && digitos.length <= 13;
    }
    function emailValido(t) {
      return !t || /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(t);
    }

    // Monto en pesos con separador de miles mientras escribe: "650000" se ve
    // "$ 650.000". En la planilla se guarda el número pelado, sin puntos ni
    // símbolo, para poder sumarlo después.
    function engancharMonto(id) {
      const el = document.getElementById(id);
      if (!el) return;
      const pintar = () => {
        const digitos = el.value.replace(/\D/g, '');
        datos[id] = digitos;
        el.value = digitos ? '$ ' + Number(digitos).toLocaleString('es-AR') : '';
      };
      el.setAttribute('inputmode', 'numeric');
      el.oninput = pintar;
      pintar();
    }

    const lista = (id, titulo, opciones) =>
      '<label><span class="t">' + titulo + '</span><select id="' + id + '">' +
      opciones.map(o => '<option' + (datos[id] === o ? ' selected' : '') + '>' + esc(o) + '</option>').join('') +
      '</select></label>';

    // Los campos de monto ya guardan su valor limpio en `datos` al escribir:
    // leerlos de la pantalla volvería a meter los puntos y el signo $.
    const CAMPOS_MONTO = ['expensas'];
    function leer(ids) {
      ids.forEach(id => {
        if (CAMPOS_MONTO.indexOf(id) !== -1) return;
        const el = document.getElementById(id);
        if (el) datos[id] = el.value.trim();
      });
    }

    // ── paso 1: contacto ───────────────────────────────────────────────────
    function paso1() {
      document.getElementById('cuerpo').innerHTML =
        '<fieldset>' +
          '<h2>Tus datos</h2>' +
          '<p class="sub">Para poder mandarte la tasación cuando esté lista.</p>' +
          campo('nombre', 'Nombre y apellido') +
          campo('telefono', 'WhatsApp', '(con característica, sin 0 ni 15)', 'tel') +
          campo('email', 'Email', '(opcional)', 'email') +
          grupo('intencion', '¿Qué querés hacer?', '',
            ['Vender', 'Saber cuánto vale', 'Vender para comprar otra', 'Alquilar']) +
          grupo('cuando', '¿Para cuándo?', '',
            ['Lo antes posible', 'En 3 meses', 'Este año', 'Todavía no sé']) +
          '<div class="botones"><button id="seguir">Seguir</button></div>' +
          '<div class="error" id="error"></div>' +
        '</fieldset>';

      engancharGrupos();
      document.getElementById('seguir').onclick = () => {
        leer(['nombre','telefono','email']);
        const aviso = document.getElementById('error');
        if (!datos.nombre || !datos.telefono) {
          aviso.textContent = 'Necesitamos al menos tu nombre y tu WhatsApp.'; return;
        }
        if (!telefonoValido(datos.telefono)) {
          aviso.textContent = 'Ese teléfono no parece completo. Poné el número con característica, sin el 0 y sin el 15.'; return;
        }
        if (!emailValido(datos.email)) {
          aviso.textContent = 'Revisá el email, parece que le falta algo.'; return;
        }
        aviso.textContent = '';
        const btn = document.getElementById('seguir');
        btn.disabled = true; btn.textContent = 'Guardando…';
        google.script.run
          .withSuccessHandler(id => { idPretasacion = id; pasoActual = 2; pintarPasos(); paso2(); })
          .withFailureHandler(err => {
            btn.disabled = false; btn.textContent = 'Seguir';
            document.getElementById('error').textContent = 'No pudimos guardar: ' + (err.message || err);
          })
          .guardarPretasacion(null, datos, 1);
      };
    }

    // ── paso 2: la propiedad ───────────────────────────────────────────────
    // Solo los que son <input>/<select>: el resto son grupos de botones y
    // se guardan solos al tocarlos.
    const CAMPOS_2 = ['direccion','barrio','piso_depto','sup_cubierta','sup_balcon','sup_descubierta',
                      'antiguedad','expensas','comentarios'];

    function paso2() {
      document.getElementById('cuerpo').innerHTML =
        '<fieldset>' +
          '<h2>La propiedad</h2>' +
          '<p class="sub">Cuanto más completo, más precisa la tasación. Si algo no lo sabés, dejalo vacío.</p>' +
          campo('direccion', 'Dirección', '(calle y altura)') +
          '<div class="chequeo" id="chequeo"></div>' +
          '<div class="dupla">' + lista('barrio', 'Barrio', [''].concat(BARRIOS)) +
            campo('piso_depto', 'Piso y depto', '(si aplica)') + '</div>' +
          grupo('tipologia', 'Tipo de propiedad', IC_EDIFICIO,
            ['Departamento', 'PH', 'Casa', 'Local']) +
          grupo('ambientes', 'Ambientes', IC_AMBIENTES, ['1','2','3','4','5','6 o más'], 'numeros') +
          grupo('dormitorios', 'Dormitorios', IC_CAMA, ['0','1','2','3','4','5 o más'], 'numeros') +
          grupo('banos', 'Baños', IC_BANO, ['1','2','3','4 o más'], 'numeros') +
          '<div class="dupla">' + campo('sup_cubierta', 'M² cubiertos', '', 'number') +
            campo('antiguedad', 'Antigüedad', '(años)', 'number') + '</div>' +
          '<div class="dupla">' + campo('sup_balcon', 'M² de balcón', '', 'number') +
            campo('sup_descubierta', 'M² de patio o terraza', '', 'number') + '</div>' +
          campo('expensas', 'Expensas por mes', '(en pesos)') +
          grupo('estado', 'Estado', '', ['Muy bueno', 'Bueno', 'A refaccionar', 'A estrenar', 'Reciclado']) +
          grupo('cochera', 'Cochera', IC_AUTO,
            ['No tiene', 'Fija cubierta', 'Fija descubierta', 'Móvil']) +
          grupo('ascensor', 'Ascensor', IC_ASCENSOR, ['Sí', 'No']) +
          '<label><span class="t">Algo más que quieras contarnos <span>(opcional)</span></span>' +
            '<textarea id="comentarios">' + esc(datos.comentarios || '') + '</textarea></label>' +
          '<div class="botones">' +
            '<button class="secundario" id="volver">Atrás</button>' +
            '<button id="seguir">Seguir</button>' +
          '</div>' +
          '<div class="error" id="error"></div>' +
        '</fieldset>';

      engancharGrupos();
      engancharMonto('expensas');

      // La dirección se chequea contra el mapa apenas la terminan de
      // escribir, no al final: así el propietario corrige en el momento y no
      // descubre el problema un agente tres días después.
      const entradaDir = document.getElementById('direccion');
      entradaDir.onblur = () => { if (entradaDir.value.trim() !== ultimaChequeada) validarDireccion(); };

      document.getElementById('volver').onclick = () => { leer(CAMPOS_2); pasoActual = 1; pintarPasos(); paso1(); };
      document.getElementById('seguir').onclick = () => {
        leer(CAMPOS_2);
        const aviso = document.getElementById('error');
        if (!datos.direccion) {
          aviso.textContent = 'Necesitamos la dirección para buscar propiedades comparables.'; return;
        }
        aviso.textContent = '';
        if (datos.direccion !== ultimaChequeada) { validarDireccion(guardarPaso2); return; }
        if (direccionOk === false && !usarIgual) {
          aviso.textContent = 'Revisá la dirección, o tocá "usarla igual" si estás seguro.'; return;
        }
        guardarPaso2();
      };
    }

    let ultimaChequeada = '';
    let direccionOk = null;
    let usarIgual = false;

    function validarDireccion(despues) {
      const texto = (document.getElementById('direccion') || {}).value;
      if (!texto || !texto.trim()) return;
      ultimaChequeada = texto.trim();
      direccionOk = null; usarIgual = false;
      const caja = document.getElementById('chequeo');
      caja.className = 'chequeo'; caja.textContent = 'Buscando la dirección…';

      google.script.run
        .withSuccessHandler(r => {
          if (r && r.ok && r.tieneAltura) {
            direccionOk = true;
            datos.direccion_normalizada = r.direccion;
            datos.lat = r.lat; datos.lon = r.lon;
            caja.className = 'chequeo ok';
            caja.textContent = '✓ ' + r.direccion;
          } else {
            direccionOk = false;
            caja.className = 'chequeo duda';
            caja.innerHTML = (r && r.ok && !r.tieneAltura)
              ? 'Falta la altura: poné calle <b>y número</b>, así podemos buscar a la redonda.'
              : (r && r.motivo === 'fuera_de_caba'
                  ? 'Esa dirección no nos da en CABA. ¿La escribiste completa? <a href="#" id="igual">usarla igual</a>'
                  : 'No encontramos esa dirección. Revisá que esté bien escrita. <a href="#" id="igual">usarla igual</a>');
            const link = document.getElementById('igual');
            if (link) link.onclick = (ev) => {
              ev.preventDefault();
              usarIgual = true;
              caja.className = 'chequeo'; caja.textContent = 'Listo, seguimos con lo que escribiste.';
            };
          }
          if (despues) despues();
        })
        .withFailureHandler(() => {
          // Si el chequeo falla, no se traba a nadie: sigue igual.
          direccionOk = false; usarIgual = true;
          caja.className = 'chequeo'; caja.textContent = '';
          if (despues) despues();
        })
        .geocodificarDireccion(texto);
    }

    function guardarPaso2() {
      const btn = document.getElementById('seguir');
      btn.disabled = true; btn.textContent = 'Guardando…';
      google.script.run
        .withSuccessHandler(() => { pasoActual = 3; pintarPasos(); paso3(); })
        .withFailureHandler(err => {
          btn.disabled = false; btn.textContent = 'Seguir';
          document.getElementById('error').textContent = 'No pudimos guardar: ' + (err.message || err);
        })
        .guardarPretasacion(idPretasacion, datos, 2);
    }

    // ── paso 3: fotos ──────────────────────────────────────────────────────
    //
    // Se achican en el navegador antes de subirlas: una foto de celular pesa
    // 4-8 MB y google.script.run no banca eso. A 1600px de lado largo y
    // calidad 0.8 quedan en ~300 KB y se siguen viendo bien en el informe.
    let subiendo = 0;

    function paso3() {
      document.getElementById('cuerpo').innerHTML =
        '<fieldset>' +
          '<h2>Fotos</h2>' +
          '<p class="sub">Sin fotos la tasación es una estimación a ciegas. Con 4 o 5 (living, cocina, baño, dormitorio y el frente) ya alcanza.</p>' +
          '<div class="soltar" id="soltar"><b>Elegí las fotos</b>desde tu celular o computadora</div>' +
          '<input type="file" id="archivos" accept="image/*" multiple hidden>' +
          '<div class="miniaturas" id="miniaturas"></div>' +
          '<div class="botones">' +
            '<button class="secundario" id="volver">Atrás</button>' +
            '<button id="terminar">Enviar</button>' +
          '</div>' +
          '<div class="error" id="error"></div>' +
        '</fieldset>';

      const entrada = document.getElementById('archivos');
      document.getElementById('soltar').onclick = () => entrada.click();
      entrada.onchange = () => { Array.from(entrada.files).forEach(agregarFoto); entrada.value = ''; };
      document.getElementById('volver').onclick = () => { pasoActual = 2; pintarPasos(); paso2(); };
      document.getElementById('terminar').onclick = () => {
        if (subiendo > 0) {
          document.getElementById('error').textContent = 'Esperá a que terminen de subir las fotos.';
          return;
        }
        const btn = document.getElementById('terminar');
        btn.disabled = true; btn.textContent = 'Enviando…';
        google.script.run
          .withSuccessHandler(() => { pasoActual = 4; pintarPasos(); listo(); })
          .withFailureHandler(() => { pasoActual = 4; pintarPasos(); listo(); })
          .guardarPretasacion(idPretasacion, {}, 3);
      };
    }

    // 20/11/2026: de a 3 por vez y hasta 15. Antes salían todas juntas y el
    // servidor anotaba una sola (Bacacay 3549: 22 fotos, 1 anotada).
    const FOTOS_MAXIMAS = 15, SUBIDAS_A_LA_VEZ = 3;
    let fotosElegidas = 0, enVuelo = 0;
    const enCola = [];
    function siguienteSubida() {
      while (enVuelo < SUBIDAS_A_LA_VEZ && enCola.length) { enVuelo++; enCola.shift()(); }
    }
    function terminoSubida() { enVuelo--; siguienteSubida(); }

    function agregarFoto(archivo) {
      if (!archivo.type.startsWith('image/')) return;
      if (fotosElegidas >= FOTOS_MAXIMAS) {
        document.getElementById('error').textContent = 'Con ' + FOTOS_MAXIMAS + ' fotos alcanza: subimos las primeras ' + FOTOS_MAXIMAS + '.';
        return;
      }
      fotosElegidas++;
      const caja = document.createElement('div');
      caja.className = 'mini';
      caja.innerHTML = '<div class="estado">subiendo…</div>';
      document.getElementById('miniaturas').appendChild(caja);

      subiendo++;
      achicar(archivo, (base64, dataUrl) => {
        caja.insertAdjacentHTML('afterbegin', '<img src="' + dataUrl + '">');
        enCola.push(() => google.script.run
          .withSuccessHandler(() => { subiendo--; caja.classList.add('lista'); terminoSubida(); })
          .withFailureHandler(err => {
            subiendo--;
            caja.querySelector('.estado').textContent = 'error';
            document.getElementById('error').textContent = 'Una foto no se pudo subir: ' + (err.message || err);
            terminoSubida();
          })
          .subirFotoPretasacion(idPretasacion, archivo.name, base64, 'image/jpeg'));
        siguienteSubida();
      });
    }

    function achicar(archivo, cuando) {
      const lector = new FileReader();
      lector.onload = () => {
        const img = new Image();
        img.onload = () => {
          const MAX = 1600;
          const escala = Math.min(1, MAX / Math.max(img.width, img.height));
          const lienzo = document.createElement('canvas');
          lienzo.width = Math.round(img.width * escala);
          lienzo.height = Math.round(img.height * escala);
          lienzo.getContext('2d').drawImage(img, 0, 0, lienzo.width, lienzo.height);
          const dataUrl = lienzo.toDataURL('image/jpeg', 0.8);
          cuando(dataUrl.split(',')[1], dataUrl);
        };
        img.src = lector.result;
      };
      lector.readAsDataURL(archivo);
    }

    function listo() {
      document.getElementById('cuerpo').innerHTML =
        '<div class="listo">' +
          '<div class="tilde"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m4 12 6 6L20 6"/></svg></div>' +
          '<h2>Listo, ' + esc((datos.nombre || '').split(' ')[0]) + '</h2>' +
          '<p class="sub" style="margin-top:8px">Ya tenemos todo. Vamos a buscar las propiedades comparables de tu zona y te escribimos por WhatsApp al ' +
          esc(datos.telefono || '') + '.</p>' +
        '</div>';
    }

    pintarPasos();
    paso1();
  </script>
</body>
</html>
